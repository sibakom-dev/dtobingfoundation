backend:
  name: github
  repo: your-org/dtobingfoundation
  branch: main
  base_url: https://sveltia-cms-auth.your-worker.workers.dev

media_folder: uploads
public_folder: /uploads

site_url: https://dtobingfoundation.org
display_url: https://dtobingfoundation.org
logo_url: /media/YDT_Logomark_Original.svg

collections:

  # ── STORIES ────────────────────────────────────────────────
  - name: stories
    label: Stories
    label_singular: Story
    folder: content/stories
    create: true
    slug: "{{slug}}"
    preview_path: "stories/{{slug}}/"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Permalink, name: permalink, widget: string, hint: "e.g. /stories/my-story/" }
      - { label: Publish Date, name: date, widget: datetime, time_format: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Category, name: category, widget: select, required: false,
          options: [Community, Artisan, Animal Welfare, Events] }
      - { label: Cover Image, name: coverImage, widget: image, required: false,
          media_folder: /uploads/stories, public_folder: /uploads/stories }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Related Program, name: program, widget: select, required: false,
          options: [paisley-things, lokal-indonesia, urip-gawe-urup] }
      - { label: Body, name: body, widget: markdown }
      - { label: Layout, name: layout, widget: hidden, default: story.njk }

  # ── EVENTS ─────────────────────────────────────────────────
  - name: events
    label: Events
    label_singular: Event
    folder: content/events
    create: true
    slug: "{{slug}}"
    preview_path: "events/{{slug}}/"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Permalink, name: permalink, widget: string, hint: "e.g. /events/my-event/" }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - { label: Event Start Date, name: eventDate, widget: datetime, time_format: false }
      - { label: Event End Date, name: eventEndDate, widget: datetime, time_format: false, required: false }
      - { label: Event Time, name: eventTime, widget: string, required: false, hint: "e.g. 10:00 to 17:00 WIB" }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Hero Image, name: heroImage, widget: image, required: false,
          media_folder: /uploads/events, public_folder: /uploads/events }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Features, name: features, widget: list, required: false,
          field: { label: Feature, name: item, widget: string } }
      - { label: Registration Link, name: registrationLink, widget: string, required: false }
      - { label: Gallery, name: gallery, widget: list, required: false,
          fields:
            - { label: Image, name: src, widget: image }
            - { label: Alt Text, name: alt, widget: string, required: false }
            - { label: Caption, name: caption, widget: string, required: false } }
      - { label: Body, name: body, widget: markdown }
      - { label: Page Description, name: pageDescription, widget: text, required: false }
      - { label: OG Image, name: ogImage, widget: image, required: false }
      - { label: Layout, name: layout, widget: hidden, default: event.njk }

  # ── PROGRAMS ───────────────────────────────────────────────
  - name: programs
    label: Programs
    label_singular: Program
    folder: content/programs
    create: false
    slug: "{{slug}}"
    files:
      - label: Paisley Things
        name: paisley-things
        file: content/programs/paisley-things.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Summary, name: summary, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, required: false,
              media_folder: /uploads/programs, public_folder: /uploads/programs }
          - { label: Objectives, name: objectives, widget: list, required: false,
              field: { label: Objective, name: item, widget: string } }
          - { label: Activities, name: activities, widget: list, required: false,
              fields:
                - { label: Title, name: title, widget: string }
                - { label: Description, name: description, widget: text }
                - { label: Image, name: image, widget: image, required: false } }
          - { label: Gallery, name: gallery, widget: list, required: false,
              fields:
                - { label: Image, name: src, widget: image }
                - { label: Alt Text, name: alt, widget: string, required: false } }
          - { label: Body, name: body, widget: markdown }
          - { label: Layout, name: layout, widget: hidden, default: program.njk }
      - label: Lokal Indonesia
        name: lokal-indonesia
        file: content/programs/lokal-indonesia.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Summary, name: summary, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, required: false,
              media_folder: /uploads/programs, public_folder: /uploads/programs }
          - { label: Objectives, name: objectives, widget: list, required: false,
              field: { label: Objective, name: item, widget: string } }
          - { label: Activities, name: activities, widget: list, required: false,
              fields:
                - { label: Title, name: title, widget: string }
                - { label: Description, name: description, widget: text }
                - { label: Image, name: image, widget: image, required: false } }
          - { label: Gallery, name: gallery, widget: list, required: false,
              fields:
                - { label: Image, name: src, widget: image }
                - { label: Alt Text, name: alt, widget: string, required: false } }
          - { label: Body, name: body, widget: markdown }
          - { label: Layout, name: layout, widget: hidden, default: program.njk }
      - label: Urip Gawe Urup
        name: urip-gawe-urup
        file: content/programs/urip-gawe-urup.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Summary, name: summary, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, required: false,
              media_folder: /uploads/programs, public_folder: /uploads/programs }
          - { label: Objectives, name: objectives, widget: list, required: false,
              field: { label: Objective, name: item, widget: string } }
          - { label: Activities, name: activities, widget: list, required: false,
              fields:
                - { label: Title, name: title, widget: string }
                - { label: Description, name: description, widget: text }
                - { label: Image, name: image, widget: image, required: false } }
          - { label: Gallery, name: gallery, widget: list, required: false,
              fields:
                - { label: Image, name: src, widget: image }
                - { label: Alt Text, name: alt, widget: string, required: false } }
          - { label: Body, name: body, widget: markdown }
          - { label: Layout, name: layout, widget: hidden, default: program.njk }

  # ── SITE SETTINGS ─────────────────────────────────────────
  - name: settings
    label: Site Settings
    files:
      - label: Global Settings
        name: global
        file: _data/site.json
        fields:
          - { label: Foundation Name, name: siteName, widget: string }
          - { label: Site URL, name: siteUrl, widget: string }
          - { label: Site Description, name: siteDescription, widget: text }
          - { label: Logo, name: logo, widget: image,
              media_folder: /uploads/site, public_folder: /uploads/site }
          - { label: Address, name: address, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Donation URL, name: donateUrl, widget: string }
          - { label: Hero Image, name: heroImage, widget: image, required: false,
              media_folder: /uploads/site, public_folder: /uploads/site }
          - label: Social Links
            name: socialLinks
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
          - label: SEO Defaults
            name: seoDefaults
            widget: object
            fields:
              - { label: Default Title, name: title, widget: string }
              - { label: Default Description, name: description, widget: text }
              - { label: Default OG Image, name: image, widget: image, required: false }
          - label: Hero Slides
            name: heroSlides
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Background Image, name: image, widget: image,
                  media_folder: /uploads/site, public_folder: /uploads/site }
              - { label: Heading (HTML allowed), name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: text }
          - label: Impact Stats
            name: impactStats
            widget: list
            fields:
              - { label: Number/Value, name: number, widget: string }
              - { label: Label, name: label, widget: string }
